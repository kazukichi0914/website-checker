<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>サイト更新チェッカー</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>サイト更新チェッカー</h1>
    <button id="checkNowBtn" title="今すぐ全サイトをチェック">今すぐチェック</button>
  </header>

  <form id="addForm">
    <input type="url" id="urlInput" placeholder="https://example.com" required />
    <input type="text" id="titleInput" placeholder="表示名(任意)" />
    <button type="submit">登録</button>
  </form>

  <p id="statusMsg" class="status"></p>

  <ul id="siteList"></ul>

  <p id="emptyMsg" class="empty" hidden>登録されたサイトはありません。上のフォームから追加してください。</p>

  <script src="popup.js"></script>
</body>
</html>
